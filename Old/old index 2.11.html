<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c10">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%23e8b84b'/><text y='19' x='2' font-size='18' font-family='sans-serif' font-weight='bold' fill='%230a0c10'>H</text></svg>">
<title>HANGER WMS &mdash; Airtable Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
.splash-screen{position:fixed;inset:0;background:#0a0c10;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s ease;}
.splash-screen.hidden{opacity:0;pointer-events:none;}
.splash-logo{width:280px;max-width:80vw;animation:splashIn 0.8s ease forwards;}
.splash-sub{font-family:'Bebas Neue',sans-serif;letter-spacing:4px;font-size:14px;color:#8b92a8;margin-top:16px;animation:splashIn 1s ease 0.3s both;}
.splash-bar{width:200px;height:3px;background:#1e2330;border-radius:3px;margin-top:24px;overflow:hidden;animation:splashIn 0.5s ease 0.5s both;}
.splash-fill{height:100%;background:linear-gradient(90deg,#1d3d8f,#c0392b,#e8b84b);border-radius:3px;animation:splashLoad 1.6s ease 0.5s forwards;}
@keyframes splashIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashLoad{from{width:0}to{width:100%}}
:root{--bg:#0a0c10;--surface:#111318;--surface2:#181b22;--border:#1e2330;--border2:#252b3a;--accent:#e8b84b;--accent2:#f5d27a;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f97316;--text:#e8eaf0;--text2:#8b92a8;--text3:#555e74;--radius:10px;--transition:0.18s ease;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.mono{font-family:'DM Mono',monospace;}
.shell{display:flex;height:100vh;}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width var(--transition);}
.sidebar.collapsed{width:60px;min-width:60px;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.logo-bar{padding:20px 16px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--accent);line-height:1;white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .logo-text{display:none;}
.nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:all var(--transition);color:var(--text2);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(232,184,75,0.12);color:var(--accent);}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-label{overflow:hidden;white-space:nowrap;}
.sidebar.collapsed .nav-label{display:none;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}
.sidebar.collapsed .nav-badge{display:none;}
.sidebar-bottom{padding:12px 8px;border-top:1px solid var(--border);}
.user-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.user-info{overflow:hidden;}
.user-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:11px;color:var(--text2);}
.sidebar.collapsed .user-info{display:none;}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;background:var(--surface);flex-shrink:0;}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;}
.warehouse-badge{display:flex;align-items:center;gap:6px;background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.25);color:var(--blue);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;}
.warehouse-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.topbar-btn{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:all var(--transition);}
.topbar-btn:hover{color:var(--text);border-color:var(--border2);}
.topbar-search{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0 12px;height:34px;flex:1;max-width:340px;}
.topbar-search input{background:none;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;width:100%;}
.topbar-search input::placeholder{color:var(--text3);}
.sync-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;white-space:nowrap;}
.sync-pill.ok{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.25);color:var(--green);}
.sync-pill.syncing{background:rgba(59,130,246,0.08);border-color:rgba(59,130,246,0.25);color:var(--blue);}
.sync-pill.error{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.25);color:var(--red);}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
.content{flex:1;overflow-y:auto;padding:24px;}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stat-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px;}
.stat-value{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;line-height:1;}
.stat-sub{font-size:11.5px;color:var(--text2);margin-top:4px;}
.stat-card.alert{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.04);}
.stat-card.alert .stat-value{color:var(--red);}
.stat-card.good{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.04);}
.stat-card.good .stat-value{color:var(--green);}
.stat-card.gold{border-color:rgba(232,184,75,0.3);background:rgba(232,184,75,0.04);}
.stat-card.gold .stat-value{color:var(--accent);}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:2px;}
.section-count{font-size:12px;color:var(--text2);background:var(--surface2);padding:2px 8px;border-radius:10px;}
.section-actions{margin-left:auto;display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:'DM Sans',sans-serif;}
.btn-primary{background:var(--accent);color:var(--bg);}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.btn-danger{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.btn svg{width:14px;height:14px;}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);color:var(--text2);background:var(--surface);transition:all var(--transition);}
.filter-chip:hover{border-color:var(--accent);color:var(--accent);}
.filter-chip.active{background:rgba(232,184,75,0.12);border-color:var(--accent);color:var(--accent);}
.filter-select{background:var(--surface);border:1px solid var(--border2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--surface2);padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid var(--border);transition:background var(--transition);cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
td{padding:10px 14px;color:var(--text);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;}
.barcode-cell{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text2);}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.badge-green{background:rgba(34,197,94,0.12);color:var(--green);}
.badge-red{background:rgba(239,68,68,0.12);color:var(--red);}
.badge-orange{background:rgba(249,115,22,0.12);color:var(--orange);}
.badge-blue{background:rgba(59,130,246,0.12);color:var(--blue);}
.badge-gray{background:var(--surface2);color:var(--text2);}
.badge-gold{background:rgba(232,184,75,0.12);color:var(--accent);}
.qty-cell{display:flex;align-items:center;gap:6px;}
.qty-display{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;min-width:28px;text-align:center;}
.qty-btn{width:22px;height:22px;border-radius:4px;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all var(--transition);}
.qty-btn:hover{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:500px;max-width:95vw;overflow:hidden;}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.modal-icon{width:36px;height:36px;border-radius:8px;background:rgba(232,184,75,0.12);border:1px solid rgba(232,184,75,0.2);display:flex;align-items:center;justify-content:center;color:var(--accent);}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;}
.modal-close{margin-left:auto;width:28px;height:28px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.modal-body{padding:24px;}
.scan-input-wrap{position:relative;margin-bottom:16px;}
.scan-input{width:100%;background:var(--surface2);border:2px solid var(--accent);border-radius:8px;padding:12px 16px 12px 44px;color:var(--text);font-family:'DM Mono',monospace;font-size:15px;outline:none;}
.scan-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--accent);}
.scan-result{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:16px;margin-bottom:16px;}
.scan-result-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.scan-result-desc{font-size:15px;font-weight:600;margin-bottom:4px;}
.scan-result-meta{font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;}
.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.scan-action-btn{padding:10px;border-radius:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;border:1px solid var(--border2);transition:all var(--transition);}
.scan-action-btn.in{background:rgba(34,197,94,0.1);color:var(--green);border-color:rgba(34,197,94,0.3);}
.scan-action-btn.in:hover{background:rgba(34,197,94,0.2);}
.scan-action-btn.out{background:rgba(239,68,68,0.1);color:var(--red);border-color:rgba(239,68,68,0.3);}
.scan-action-btn.out:hover{background:rgba(239,68,68,0.2);}
.detail-panel{position:fixed;right:0;top:0;bottom:0;width:400px;background:var(--surface);border-left:1px solid var(--border2);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.25s ease;}
.detail-panel.open{transform:translateX(0);}
.detail-header{padding:20px;border-bottom:1px solid var(--border);}
.detail-barcode{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);margin-bottom:4px;}
.detail-desc{font-size:16px;font-weight:700;line-height:1.3;margin-bottom:12px;}
.detail-body{flex:1;padding:20px;overflow-y:auto;}
.detail-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.detail-row:last-child{border-bottom:none;}
.detail-key{font-size:12px;color:var(--text2);font-weight:500;}
.detail-val{font-size:13px;font-weight:600;font-family:'DM Mono',monospace;}
.qty-editor{display:flex;align-items:center;gap:10px;margin-bottom:16px;background:var(--surface2);border-radius:10px;padding:12px 16px;}
.qty-editor-label{flex:1;font-size:13px;color:var(--text2);}
.qty-editor-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);min-width:50px;text-align:center;}
.minmax-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.minmax-field{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;}
.minmax-label{font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
.minmax-input{background:none;border:none;outline:none;color:var(--text);font-family:'DM Mono',monospace;font-size:16px;font-weight:600;width:100%;}
.field-group{margin-bottom:14px;}
.field-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
.field-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.field-input:focus{border-color:var(--accent);}
.field-textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;resize:vertical;min-height:70px;}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-box{width:400px;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo-mark{width:56px;height:56px;background:var(--accent);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;}
.login-logo-text{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:6px;color:var(--accent);display:block;}
.login-sub{font-size:13px;color:var(--text2);display:block;margin-top:4px;}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:28px;}
.setup-card{background:var(--surface);border:1px solid rgba(232,184,75,0.3);border-radius:14px;padding:24px;margin-bottom:16px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.role-btn{padding:14px 10px;border-radius:9px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;text-align:center;transition:all var(--transition);}
.role-btn:hover{border-color:var(--accent);}
.role-btn.selected{border-color:var(--accent);background:rgba(232,184,75,0.1);}
.role-btn-icon{font-size:20px;margin-bottom:6px;}
.role-btn-label{font-size:12.5px;font-weight:600;color:var(--text);display:block;}
.pin-row{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);transition:all var(--transition);}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.pin-key{padding:14px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;text-align:center;font-size:17px;font-weight:600;transition:all var(--transition);}
.pin-key:hover{background:var(--border2);}
.pin-key:active{background:var(--accent);color:var(--bg);}
.login-btn{width:100%;padding:12px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all var(--transition);}
.login-btn:hover{background:var(--accent2);}
.login-btn:disabled{opacity:0.4;cursor:not-allowed;}
.alert-item{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:8px;border-left:3px solid;}
.alert-item.critical{border-left-color:var(--red);}
.alert-item.warning{border-left-color:var(--orange);}
.alert-item.info{border-left-color:var(--blue);}
.alert-item-title{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.alert-item-desc{font-size:12px;color:var(--text2);line-height:1.5;}
.alert-item-time{font-size:11px;color:var(--text3);margin-top:6px;font-family:'DM Mono',monospace;}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:12px 16px;display:flex;align-items:center;gap:10px;min-width:280px;box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:toastIn 0.2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.toast.success .toast-icon{background:rgba(34,197,94,0.15);color:var(--green);}
.toast.error .toast-icon{background:rgba(239,68,68,0.15);color:var(--red);}
.toast.info .toast-icon{background:rgba(59,130,246,0.15);color:var(--blue);}
.toast-msg{font-size:13px;font-weight:500;flex:1;}
.empty-state{text-align:center;padding:48px 24px;color:var(--text2);}
.empty-state-icon{font-size:40px;margin-bottom:12px;opacity:0.4;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.wh-selector{display:flex;gap:8px;margin-bottom:20px;}
.wh-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer;transition:all var(--transition);}
.wh-tab.active{background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.3);color:var(--blue);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
.c-gold{color:var(--accent);}.c-red{color:var(--red);}.c-green{color:var(--green);}.c-blue{color:var(--blue);}.c-gray{color:var(--text2);}
.fw6{font-weight:600;}.fw7{font-weight:700;}
.text-xs{font-size:11px;}.text-sm{font-size:12px;}
</style>

// ── AIRTABLE API ──────────────────────────────────────────
function isConfigured() {
  return CONFIG.token !== 'PASTE_TOKEN_HERE' && CONFIG.baseId !== 'PASTE_BASE_ID_HERE' && CONFIG.token.length > 10 && CONFIG.baseId.length > 5;
}
function atHeaders() {
  return { 'Authorization': 'Bearer ' + CONFIG.token, 'Content-Type': 'application/json' };
}
function atBase() {
  return 'https://api.airtable.com/v0/' + CONFIG.baseId + '/';
}
async function atFetchAll(table) {
  var records = [], offset = null;
  var tbl = encodeURIComponent(CONFIG.tables[table]);
  do {
    var url = atBase() + tbl + '?pageSize=100' + (offset ? '&offset=' + offset : '');
    var res = await fetch(url, { headers: atHeaders() });
    if (!res.ok) { var e = await res.json().catch(function(){return{};}); throw new Error((e.error&&e.error.message)||'HTTP '+res.status); }
    var data = await res.json();
    records = records.concat(data.records);
    offset = data.offset || null;
  } while (offset);
  return records;
}
async function atCreate(table, fields) {
  var url = atBase() + encodeURIComponent(CONFIG.tables[table]);
  var res = await fetch(url, { method:'POST', headers:atHeaders(), body:JSON.stringify({records:[{fields:fields}]}) });
  if (!res.ok) {
    var e = await res.json().catch(function(){return{};});
    var msg = (e.error&&e.error.message) || JSON.stringify(e) || 'HTTP '+res.status;
    console.error('atCreate error for table', table, ':', msg, 'fields:', JSON.stringify(fields));
    throw new Error(msg);
  }
  var data = await res.json();
  return data.records[0];
}
async function atUpdate(table, id, fields) {
  var url = atBase() + encodeURIComponent(CONFIG.tables[table]) + '/' + id;
  var res = await fetch(url, { method:'PATCH', headers:atHeaders(), body:JSON.stringify({fields:fields}) });
  if (!res.ok) { var e = await res.json().catch(function(){return{};}); throw new Error((e.error&&e.error.message)||'HTTP '+res.status); }
  return res.json();
}
async function atFetch(path, opts) {
  // legacy - only used by testConnection
  opts = opts || {};
  var url = atBase() + encodeURIComponent(path.split('?')[0]) + (path.indexOf('?')>=0 ? path.slice(path.indexOf('?')) : '');
  var res = await fetch(url, Object.assign({ headers: atHeaders() }, opts));
  if (!res.ok) { var e = await res.json().catch(function(){return{};}); throw new Error((e.error&&e.error.message)||'HTTP '+res.status); }
  return res.json();
}

async function syncInventory() {
  if (!isConfigured()) { state.syncStatus = 'unconfigured'; render(); return; }
  state.syncStatus = 'syncing'; render();
  try {
    var records = await atFetchAll('inventory');
    var atMap = {};
    records.forEach(function(r) { if (r.fields.barcode) atMap[r.fields.barcode] = r; });
    state.airtableMap = atMap;
    state.inventory = STATIC_SKUS.map(function(sku) {
      var rec = atMap[sku.barcode];
      if (rec) {
        return Object.assign({}, sku, {
          qty: rec.fields.qty || 0, min_qty: rec.fields.min_qty || sku.min_qty,
          max_qty: rec.fields.max_qty || sku.max_qty, notes: rec.fields.notes || '',
          assigned_job: rec.fields.assigned_job || '', last_scan_status: rec.fields.last_scan_status || '',
          date_scanned: rec.fields.date_scanned || '', category: rec.fields.category || sku.category,
          vendor: rec.fields.vendor || sku.vendor, price: rec.fields.price || sku.price,
          warehouse: rec.fields.warehouse || sku.warehouse, _atId: rec.id, _inAirtable: true
        });
      }
      return Object.assign({}, sku, { qty:0, assigned_job:'', last_scan_status:'', date_scanned:'', _inAirtable:false });
    });
    state.syncStatus = 'ok'; state.lastSync = new Date(); buildAlerts(); render();
  } catch(e) { state.syncStatus = 'error'; showToast('Sync failed: ' + e.message, 'error'); render(); }
}

async function pushQtyChange(item, delta, newQty) {
  var action = delta > 0 ? 'IN' : 'OUT';
  var now = new Date().toISOString().replace('T',' ').slice(0,19);
  var fields = { barcode:item.barcode, description:item.description, qty:newQty, min_qty:item.min_qty, max_qty:item.max_qty,
    notes:item.notes||'', assigned_job:item.assigned_job||'', last_scan_status:action+' ('+Math.abs(delta)+')',
    date_scanned:now, category:item.category, vendor:item.vendor, price:item.price||0, warehouse:item.warehouse,
    type:item.type||'DURABLE', mfr_part:item.mfr_part||'', vendor_part:item.vendor_part||'' };
  try {
    if (item._inAirtable && item._atId) { await atUpdate('inventory', item._atId, fields); }
    else { var rec = await atCreate('inventory', fields); item._atId = rec.id; item._inAirtable = true; }
    await atCreate('scanLog', { barcode:item.barcode, description:item.description, action:action,
      delta:Math.abs(delta), qty_after:newQty, warehouse:item.warehouse, assigned_job:item.assigned_job||'',
      scanned_at:now, role:ROLES[state.role].label, scanned_by:CONFIG.username||'Unknown' });
  } catch(e) { showToast('Write queued \u2014 retry when online', 'info'); }
}

async function pushDetailUpdate(item) {
  if (!isConfigured()) return;
  var fields = { min_qty:item.min_qty, max_qty:item.max_qty, notes:item.notes||'', assigned_job:item.assigned_job||'', category:item.category, vendor:item.vendor, price:item.price||0, warehouse:item.warehouse };
  try {
    if (item._inAirtable && item._atId) { await atUpdate('inventory', item._atId, fields); }
    else { var rec = await atCreate('inventory', Object.assign({}, fields, {barcode:item.barcode,description:item.description,qty:item.qty,mfr_part:item.mfr_part||'',vendor_part:item.vendor_part||'',type:item.type||'DURABLE'})); item._atId=rec.id; item._inAirtable=true; }
    showToast('Saved to Airtable', 'success');
  } catch(e) { showToast('Save failed: ' + e.message, 'error'); }
}

function getInventory() {
  return state.inventory.filter(function(i) {
    if (state.warehouse !== 'ALL' && i.warehouse !== state.warehouse) return false;
    if (state.filterCat !== 'ALL' && i.category !== state.filterCat) return false;
    if (state.filterVendor !== 'ALL' && i.vendor !== state.filterVendor) return false;
    if (state.filterStatus === 'LOW' && i.qty >= i.min_qty) return false;
    if (state.filterStatus === 'ZERO' && i.qty !== 0) return false;
    if (state.filterStatus === 'STOCKED' && i.qty < i.min_qty) return false;
    if (state.searchQ) {
      var q = state.searchQ.toLowerCase();
      if (!i.description.toLowerCase().includes(q) && !i.barcode.toLowerCase().includes(q) && !i.vendor.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}
function getLow()  { return state.inventory.filter(function(i){return i.qty<i.min_qty&&i.qty>0;}).length; }
function getZero() { return state.inventory.filter(function(i){return i.qty===0;}).length; }
function getVal()  { return state.inventory.reduce(function(s,i){return s+i.qty*(i.price||0);},0); }
function canEdit() { return state.role !== 'sales_rep'; }
function lookupBarcode(code) { return state.inventory.find(function(i){return i.barcode.toLowerCase()===code.toLowerCase().trim();}); }
function buildAlerts() {
  var alerts = [];
  if (getZero()>0) alerts.push({type:'critical',title:getZero()+' Items at Zero Qty',desc:'Need physical count and scan-in.',time:'Auto-detected'});
  if (getLow()>0)  alerts.push({type:'warning', title:getLow()+' Items Below Minimum', desc:'Reorder recommended.',time:'Auto-detected'});
  state.alerts = alerts;
}
function adjustQty(barcode, delta) {
  var item = state.inventory.find(function(i){return i.barcode===barcode;});
  if (!item || !canEdit()) return;
  var newQty = Math.max(0, item.qty + delta);
  item.qty = newQty;
  item.last_scan_status = (delta>0?'IN':'OUT') + ' (' + Math.abs(delta) + ')';
  item.date_scanned = new Date().toISOString().replace('T',' ').slice(0,19);
  state.scanHistory.unshift({barcode:barcode,desc:item.description,action:delta>0?'IN':'OUT',delta:Math.abs(delta),qty:newQty,ts:new Date().toLocaleTimeString()});
  showToast((delta>0?'IN':'OUT')+': '+item.description.substring(0,32)+' \u2192 Qty '+newQty, delta>0?'success':'info');
  if (isConfigured()) pushQtyChange(item, delta, newQty);
  buildAlerts(); render();
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg, type) {
  type = type || 'success';
  var icons = {success:'&#10003;',error:'&#10005;',info:'i'};
  var wrap = document.getElementById('toastWrap');
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<div class="toast-icon">' + (icons[type]||'i') + '</div><div class="toast-msg">' + msg + '</div>';
  wrap.appendChild(el);
  setTimeout(function(){el.style.opacity='0';el.style.transform='translateY(10px)';el.style.transition='0.3s';setTimeout(function(){el.remove();},300);}, 3200);
}

    '<div class="stat-card gold"><div class="stat-label">Inventory Value</div><div class="stat-value">$'+Math.round(getVal()).toLocaleString()+'</div><div class="stat-sub">At purchase price</div></div>' +

function renderInventory() {
  var items = getInventory();
  var whTabs = ['ALL'].concat(WAREHOUSES).map(function(w){
    return '<div class="wh-tab'+(state.warehouse===w?' active':'')+'" onclick="setWarehouse(\''+w+'\')">'+w+'</div>';
  }).join('');
  var catChips = CATEGORIES.map(function(c){
    return '<div class="filter-chip'+(state.filterCat===c?' active':'')+'" onclick="setCatFilter(\''+c+'\')">'+c+'</div>';
  }).join('');
  var vendorOpts = VENDORS.map(function(v){
    return '<option value="'+v+'"'+(state.filterVendor===v?' selected':'')+'>'+v+'</option>';
  }).join('');
  var statusOpts = [['ALL','All Status'],['ZERO','Zero Qty'],['LOW','Below Min'],['STOCKED','In Stock']].map(function(o){
    return '<option value="'+o[0]+'"'+(state.filterStatus===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('');
  var rows = items.length === 0
    ? '<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text2)">No items match filters</td></tr>'
    : items.map(function(item){
        var sb, sc;
        if (item.qty===0){sb='ZERO';sc='badge-red';}
        else if (item.qty<item.min_qty){sb='LOW';sc='badge-orange';}
        else if (item.qty>item.max_qty){sb='OVER';sc='badge-blue';}
        else{sb='OK';sc='badge-green';}
        var qtyColor = item.qty===0?'c-red':item.qty<item.min_qty?'c-gold':'c-green';
        var editBtns = canEdit()
          ? '<div class="qty-btn" onclick="event.stopPropagation();adjustQty(\''+item.barcode+'\',-1)">\u2212</div><div class="qty-btn" onclick="event.stopPropagation();adjustQty(\''+item.barcode+'\',1)">+</div>'
          : '';
        return '<tr onclick="openDetail(\''+item.barcode+'\')">' +
          '<td class="barcode-cell">'+item.barcode+'</td>' +
          '<td title="'+item.description+'">'+item.description+'</td>' +
          '<td><span class="badge badge-gray text-xs">'+item.category.substring(0,14)+'</span></td>' +
          '<td class="c-gray text-sm">'+item.vendor+'</td>' +
          '<td><div class="qty-cell" style="justify-content:center" onclick="event.stopPropagation()">'+
            (canEdit()?'<div class="qty-btn" onclick="adjustQty(\''+item.barcode+'\',-1)">\u2212</div>':'')+
            '<span class="qty-display '+qtyColor+'">'+item.qty+'</span>'+
            (canEdit()?'<div class="qty-btn" onclick="adjustQty(\''+item.barcode+'\',1)">+</div>':'')+
          '</div></td>' +
          '<td class="mono c-gray">'+item.min_qty+'</td>' +
          '<td class="mono c-gray">'+item.max_qty+'</td>' +
          '<td class="mono">'+(item.price>0?'$'+item.price.toFixed(2):'\u2014')+'</td>' +
          '<td><span class="badge '+sc+'">'+sb+'</span></td>' +
          '<td class="c-gray text-sm">'+(item.assigned_job||'\u2014')+'</td>' +
        '</tr>';
      }).join('');
  return '<div class="wh-selector">' + whTabs + '</div>' +
    '<div class="filters">' + catChips + '<select class="filter-select" onchange="setVendorFilter(this.value)">' + vendorOpts + '</select><select class="filter-select" onchange="setStatusFilter(this.value)">' + statusOpts + '</select></div>' +
    '<div class="section-header"><div class="section-title">Inventory</div><div class="section-count">'+items.length+' items</div><div class="section-actions"><div class="btn btn-ghost" onclick="syncInventory()">'+I.refresh+' Refresh</div>'+(canEdit()?'<div class="btn btn-primary" onclick="openScan()">'+I.scan+' Scan</div>':'')+'</div></div>' +
    '<div class="table-wrap"><div class="table-scroll"><table><thead><tr><th>Barcode</th><th>Description</th><th>Category</th><th>Vendor</th><th style="text-align:center">Qty</th><th>Min</th><th>Max</th><th>Price</th><th>Status</th><th>Job</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

function renderScanPage() {
  var modeBtn1 = !state.countMode ? 'btn-primary' : 'btn-ghost';
  var modeBtn2 = state.countMode  ? 'btn-primary' : 'btn-ghost';
  var body;
  if (state.countMode) {
    var entries = Object.entries(state.countBuffer);
    var bufHtml = entries.length === 0
      ? '<div style="text-align:center;color:var(--text3);font-size:13px;padding:16px">Start scanning \u2014 each scan = 1 unit</div>'
      : '<div style="background:var(--surface2);border-radius:8px;padding:12px;margin-bottom:12px;max-height:200px;overflow-y:auto">' +
          entries.map(function(e){ var item=state.inventory.find(function(i){return i.barcode===e[0];}); return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px"><span>'+((item&&item.description)||e[0]).substring(0,35)+'</span><span class="mono c-gold fw6">'+e[1]+'</span></div>'; }).join('') +
        '</div>' +
        '<div class="btn btn-primary" onclick="commitCount()">\u2713 Commit Count (' + entries.length + ' items)</div>';
    body = '<div style="background:rgba(232,184,75,0.08);border:2px solid var(--accent);border-radius:12px;padding:18px;margin-bottom:16px">' +

      '<div style="font-size:13px;color:var(--text2);margin-bottom:14px">Each scan = +1. Commit when done to push all counts to Airtable.</div>' +
      '<div class="scan-input-wrap"><div class="scan-icon">'+I.scan+'</div><input class="scan-input" id="scanInputPage" placeholder="Scan barcode\u2026" autocomplete="off"></div>' +
      bufHtml + '</div>';
  } else {
    var resultHtml = '';
    if (state.scanResult && state.scanResult !== false) {
      var r = state.scanResult;
      var qc = r.qty===0?'var(--red)':r.qty<r.min_qty?'var(--accent)':'var(--green)';
      var inBtns  = [1,2,5,10].map(function(n){return '<div class="scan-action-btn in" onclick="scanAction(\'in\','+n+')">+ IN ('+n+')</div>';}).join('');
      var outBtns = [1,2,5,10].map(function(n){return '<div class="scan-action-btn out" onclick="scanAction(\'out\','+n+')">\u2212 OUT ('+n+')</div>';}).join('');
      resultHtml = '<div class="scan-result">' +
        '<div class="scan-result-label">Item Found</div>' +
        '<div class="scan-result-desc">'+r.description+'</div>' +
        '<div class="scan-result-meta">'+r.barcode+' \u00b7 '+r.category+' \u00b7 '+r.vendor+'</div>' +
        '<div style="margin-top:10px;display:flex;align-items:center;gap:12px"><div style="font-size:13px;color:var(--text2)">Qty:</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;color:'+qc+'">'+r.qty+'</div><div style="font-size:12px;color:var(--text2)">Min: '+r.min_qty+' / Max: '+r.max_qty+'</div></div>' +
        '</div>' +
        '<div class="scan-actions">' + inBtns + outBtns + '</div>' +
        '<div style="margin-top:12px"><div class="btn btn-ghost" style="font-size:11px" onclick="openDetail(\''+r.barcode+'\')">View Detail</div></div>';
    } else if (state.scanResult === false) {
      resultHtml = '<div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:8px;padding:14px;color:var(--red);font-size:13px;text-align:center">\u26a0 Barcode not found</div>';
    }
    body = '<div style="background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:24px;margin-bottom:16px">' +
      '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:6px;color:var(--accent)">SCAN ITEM</div>' +
      '<div style="font-size:12.5px;color:var(--text2);margin-bottom:16px">Scan barcode or type manually, press Enter.</div>' +
      '<div class="scan-input-wrap" style="margin-bottom:16px"><div class="scan-icon">'+I.scan+'</div><input class="scan-input" id="scanInputPage" placeholder="Scan or type barcode\u2026" autocomplete="off"></div>' +
      resultHtml + '</div>';
  }
  var histHtml = '';
  if (state.scanHistory.length > 0) {
    histHtml = '<div class="section-header"><div class="section-title">Session Log</div><div class="section-count">'+state.scanHistory.length+'</div></div>' +
      '<div class="table-wrap"><div class="table-scroll"><table><thead><tr><th>Barcode</th><th>Description</th><th>Action</th><th>Qty After</th><th>Time</th></tr></thead><tbody>' +
      state.scanHistory.slice(0,20).map(function(h){
        return '<tr><td class="barcode-cell">'+h.barcode+'</td><td>'+h.desc+'</td><td><span class="badge '+(h.action==='IN'?'badge-green':'badge-red')+'">'+h.action+'</span></td><td class="mono">'+h.qty+'</td><td class="mono c-gray">'+h.ts+'</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  return '<div style="max-width:620px;margin:0 auto">' +
    '<div style="display:flex;gap:8px;margin-bottom:16px">' +
      '<div class="btn '+modeBtn1+'" onclick="state.countMode=false;render()">\uD83D\uDCF7 Single Scan</div>' +
      '<div class="btn '+modeBtn2+'" onclick="toggleCountMode()">\uD83D\uDCE6 Count Mode</div>' +
    '</div>' + body + histHtml + '</div>';
}

function renderReports() {
  var byVendor = {};
  VENDORS.filter(function(v){return v!=='ALL';}).forEach(function(v){
    var items = state.inventory.filter(function(i){return i.vendor===v;});
    byVendor[v]={count:items.length,inStock:items.filter(function(i){return i.qty>0;}).length,value:items.reduce(function(s,i){return s+i.qty*(i.price||0);},0)};
  });
  var vRows = Object.entries(byVendor).filter(function(e){return e[1].count>0;}).sort(function(a,b){return b[1].count-a[1].count;}).map(function(e){
    return '<tr><td>'+e[0]+'</td><td class="mono">'+e[1].count+'</td><td class="mono c-green">'+e[1].inStock+'</td><td class="mono">$'+Math.round(e[1].value).toLocaleString()+'</td></tr>';
  }).join('');
  var wRows = WAREHOUSES.map(function(w){
    var items = state.inventory.filter(function(i){return i.warehouse===w;});
    return '<tr><td>'+w+'</td><td class="mono">'+items.length+'</td><td class="mono c-green">'+items.filter(function(i){return i.qty>0;}).length+'</td><td class="mono c-red">'+items.filter(function(i){return i.qty===0;}).length+'</td></tr>';
  }).join('');
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">' +
    '<div><div class="section-header"><div class="section-title">By Vendor</div></div><div class="table-wrap"><table><thead><tr><th>Vendor</th><th>SKUs</th><th>In Stock</th><th>Value</th></tr></thead><tbody>' + vRows + '</tbody></table></div></div>' +
    '<div><div class="section-header"><div class="section-title">By Warehouse</div></div><div class="table-wrap"><table><thead><tr><th>Warehouse</th><th>SKUs</th><th>In Stock</th><th>Zero</th></tr></thead><tbody>' + wRows + '</tbody></table></div></div>' +
  '</div>';
}

function renderLogin() {
  var pin = state.pinBuffer;
  var keys = ['1','2','3','4','5','6','7','8','9','','0','\u232b'];
  var roleHtml = Object.entries(ROLES).map(function(e) {
    var k=e[0], v=e[1];
    return '<div class="role-btn'+(state.selectedRole===k?' selected':'')+'" data-role="'+k+'"><div class="role-btn-icon">'+v.icon+'</div><span class="role-btn-label">'+v.label+'</span></div>';
  }).join('');
  var pinRow = [0,1,2,3].map(function(i){ return '<div class="pin-dot'+(i<pin.length?' filled':'')+'"></div>'; }).join('');
  var pinPad = keys.map(function(k){ return k==='' ? '<div></div>' : '<div class="pin-key" data-key="'+k+'">'+k+'</div>'; }).join('');
  return '<div class="login-screen"><div class="login-box">' +
    '<div class="login-logo">' +
      '<div class="login-logo-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0a0c10" stroke-width="2.5"><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35z"/></svg></div>' +
      '<span class="login-logo-text">HANGER</span>' +
      '<span class="login-sub">Warehouse Management &middot; Airtable Cloud</span>' +
    '</div>' +
    '<div class="login-card">' +
      '<div style="font-size:14px;font-weight:600;margin-bottom:18px;text-align:center;color:var(--text2)">Select your role</div>' +
      '<div class="role-grid">'+roleHtml+'</div>' +
      '<div class="pin-row">'+pinRow+'</div>' +
      '<div class="pin-pad">'+pinPad+'</div>' +
      '<button class="login-btn" id="loginBtn"'+(pin.length<4?' disabled':'')+'>Enter</button>' +
    '</div>' +
  '</div></div>';
}

// ── BINDING ───────────────────────────────────────────────
function bindLogin() {
  document.querySelectorAll('[data-role]').forEach(function(el) {
    el.addEventListener('click', function() { state.selectedRole = el.dataset.role; state.pinBuffer = ''; render(); });
  });
  document.querySelectorAll('.pin-key').forEach(function(el) {
    el.addEventListener('click', function() {
      var k = el.dataset.key;
      if (k === '\u232b') { state.pinBuffer = state.pinBuffer.slice(0,-1); }
      else if (state.pinBuffer.length < 4) { state.pinBuffer += k; }
      if (state.pinBuffer.length === 4) {
        if (ROLES[state.selectedRole].pin === state.pinBuffer) {
          state.loggedIn = true; state.role = state.selectedRole; state.pinBuffer = '';
          if(!isConfigured()){state.page='settings';} render(); syncInventory();
        } else {
          showToast('Incorrect PIN', 'error');
          setTimeout(function(){ state.pinBuffer = ''; render(); }, 600);
        }
        return;
      }
      render();
    });
  });
  var btn = document.getElementById('loginBtn');
  if (btn) btn.addEventListener('click', function() {
    if (ROLES[state.selectedRole].pin === state.pinBuffer) {
      state.loggedIn = true; state.role = state.selectedRole; state.pinBuffer = '';
      render(); syncInventory();
    } else { showToast('Incorrect PIN', 'error'); state.pinBuffer = ''; render(); }
  });
}

function bindMain() {
  document.querySelectorAll('[data-page]').forEach(function(el) {
    el.addEventListener('click', function() { state.page = el.dataset.page; state.scanResult = null; render(); });
  });
  var tog = document.getElementById('toggleSidebar');
  if (tog) tog.addEventListener('click', function() { state.sidebarCollapsed = !state.sidebarCollapsed; render(); });
  var logout = document.getElementById('logoutBtn');
  if (logout) logout.addEventListener('click', function() { state.loggedIn = false; state.role = null; state.inventory = []; state.syncStatus = 'idle'; render(); });
  var si = document.getElementById('searchInput');
  if (si) si.addEventListener('input', function(e) { state.searchQ = e.target.value; clearTimeout(window._dt); window._dt = setTimeout(render, 150); });
  var scanBtn = document.getElementById('scanBtn');
  if (scanBtn) scanBtn.addEventListener('click', openScan);
  var ov = document.getElementById('scanOverlay');
  if (ov) ov.addEventListener('click', function(e) { if (e.target === ov) closeScan(); });
  var cs = document.getElementById('closeScan');
  if (cs) cs.addEventListener('click', closeScan);
  var sm = document.getElementById('scanInputModal');
  if (sm) {
    sm.focus();
    sm.addEventListener('keydown', function(e) { if (e.key === 'Enter') { doScan(sm.value); sm.value = ''; } });
  }
  var sp = document.getElementById('scanInputPage');
  if (sp) {
    sp.focus();
    sp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        if (state.countMode) { doCountScan(sp.value.trim()); }
        else { doScan(sp.value.trim()); }
        sp.value = '';
      }
    });
  }
  var wh = document.getElementById('whBadge');
  if (wh) wh.addEventListener('click', function() {
    var opts = ['ALL'].concat(WAREHOUSES);
    var idx = opts.indexOf(state.warehouse);
    state.warehouse = opts[(idx + 1) % opts.length];
    render();
  });
}

// ── ACTIONS ───────────────────────────────────────────────
function setPage(p)         { state.page = p; state.scanResult = null; render(); }
function setWarehouse(w)    { state.warehouse = w; render(); }
function setCatFilter(c)    { state.filterCat = c; render(); }
function setVendorFilter(v) { state.filterVendor = v; render(); }
function setStatusFilter(s) { state.filterStatus = s; render(); }
function openScan()         { state.scanModal = true; state.scanResult = null; render(); }
function closeScan()        { state.scanModal = false; state.scanResult = null; render(); }
function openDetail(bc)     { state.detailItem = state.inventory.find(function(i){return i.barcode===bc;}); render(); }
function closeDetail()      { state.detailItem = null; render(); }

function doScan(code) {
  if (!code || code.trim().length < 2) return;
  var item = lookupBarcode(code.trim());
  state.scanResult = item || false;
  render();
  if (item) showToast('Found: ' + item.description.substring(0,40), 'info');
  else showToast('Barcode not found in catalog', 'error');
}

function doCountScan(code) {
  if (!code) return;
  var item = lookupBarcode(code);
  if (!item) { showToast('Barcode not found', 'error'); return; }
  state.countBuffer[item.barcode] = (state.countBuffer[item.barcode] || 0) + 1;
  showToast(item.description.substring(0,28) + ' \u2192 ' + state.countBuffer[item.barcode], 'info');
  render();
}

function scanAction(dir, qty) {
  if (!state.scanResult || state.scanResult === false) return;
  var delta = dir === 'in' ? qty : -qty;
  adjustQty(state.scanResult.barcode, delta);
  state.scanResult = state.inventory.find(function(i){return i.barcode === state.scanResult.barcode;});
  render();
}

function adjDetail(delta) {
  if (!state.detailItem) return;
  adjustQty(state.detailItem.barcode, delta);
  state.detailItem = state.inventory.find(function(i){return i.barcode === state.detailItem.barcode;});
  var el = document.getElementById('detailQty');
  if (el) el.textContent = state.detailItem.qty;
}

function saveDetail() {
  var item = state.detailItem;
  var minI = document.getElementById('minInput');
  var maxI = document.getElementById('maxInput');
  var jobI = document.getElementById('jobInput');
  var notI = document.getElementById('notesInput');
  if (minI) item.min_qty = parseInt(minI.value) || item.min_qty;
  if (maxI) item.max_qty = parseInt(maxI.value) || item.max_qty;
  if (jobI) item.assigned_job = jobI.value;
  if (notI) item.notes = notI.value;
  pushDetailUpdate(item);
  closeDetail();
}

function toggleCountMode() {
  state.countMode = !state.countMode;
  state.countBuffer = {};
  showToast(state.countMode ? 'Count Mode ON' : 'Count Mode OFF', 'info');
  render();
}

async function commitCount() {
  var entries = Object.entries(state.countBuffer);
  if (entries.length === 0) return;
  for (var i = 0; i < entries.length; i++) {
    var bc = entries[i][0], qty = entries[i][1];
    var item = state.inventory.find(function(x){return x.barcode===bc;});
    if (!item) continue;
    var delta = qty - item.qty;
    item.qty = qty;
    item.last_scan_status = 'COUNT';
    item.date_scanned = new Date().toISOString().replace('T',' ').slice(0,19);
    if (isConfigured()) await pushQtyChange(item, delta, qty);
  }
  showToast('Count committed: ' + entries.length + ' items updated to Airtable', 'success');
  state.countMode = false; state.countBuffer = {}; buildAlerts(); render();
}

function saveConfig() {
  var t  = (document.getElementById('cfgToken')    || {}).value;
  var b  = (document.getElementById('cfgBaseId')   || {}).value;
  var iv = (document.getElementById('cfgInvTable') || {}).value;
  var lg = (document.getElementById('cfgLogTable') || {}).value;
  if (!t || !b || !t.trim() || !b.trim()) { showToast('Token and Base ID are required', 'error'); return; }
  CONFIG.token = t.trim();
  CONFIG.baseId = b.trim();
  if (iv && iv.trim()) CONFIG.tables.inventory = iv.trim();
  if (lg && lg.trim()) CONFIG.tables.scanLog   = lg.trim();
  showToast('Config saved \u2014 connecting to Airtable\u2026', 'success');
  syncInventory();
}

async function testConnection() {
  if (!isConfigured()) { showToast('Not configured', 'error'); return; }
  showToast('Testing connection\u2026', 'info');
  try {
    await atFetch(CONFIG.tables.inventory + '?maxRecords=1');
    showToast('Connection OK \u2014 Airtable responded successfully', 'success');
  } catch(e) { showToast('Connection failed: ' + e.message, 'error'); }
}

function exportInventoryCSV() {
  var rows = [['barcode','description','qty','min_qty','max_qty','category','vendor','price','warehouse','mfr_part','vendor_part','notes','assigned_job','last_scan_status','date_scanned','type']];
  state.inventory.forEach(function(i) {
    rows.push([i.barcode,'"'+(i.description||'').replace(/"/g,'""')+'"',i.qty,i.min_qty,i.max_qty,i.category,i.vendor,i.price||0,i.warehouse,i.mfr_part||'',i.vendor_part||'','"'+(i.notes||'').replace(/"/g,'""')+'"',i.assigned_job||'',i.last_scan_status||'',i.date_scanned||'',i.type||'DURABLE']);
  });
  var csv = rows.map(function(r){return r.join(',');}).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'hanger_inventory_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast('Exported ' + state.inventory.length + ' items', 'success');
}

function exportScanLog() {
  if (state.scanHistory.length === 0) { showToast('No scan history this session', 'info'); return; }
  var rows = [['barcode','description','action','delta','qty_after','time']];
  state.scanHistory.forEach(function(h) {
    rows.push([h.barcode,'"'+(h.desc||'').replace(/"/g,'""')+'"',h.action,h.delta||'',h.qty,h.ts]);
  });
  var csv = rows.map(function(r){return r.join(',');}).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'hanger_scanlog_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast('Scan log exported', 'success');
}

// ── INIT ──────────────────────────────────────────────────
setTimeout(hideSplash, 20000);
render();
</script>
</body>

<script>
// ═══════════════════════════════════════
//  V2 ADDITIONS — injected after main script
// ═══════════════════════════════════════

// ── AIRTABLE PICKLIST / BARCODE SYNC ──

function handleEnterKey(event, fn) {
  if (event.key === 'Enter') { event.preventDefault(); fn(); }
}

async function syncPicklists() {
  if (!isConfigured()) return;
  try {
    var recs = await atFetchAll('picklists');
    state.picklists = recs.map(function(r){ return Object.assign({_atId:r.id},r.fields); });
  } catch(e) { console.warn('Picklist sync:',e.message); }
}

async function syncPicklistItems() {
  if (!isConfigured()) return;
  try {
    var recs = await atFetchAll('picklistItems');
    state.picklistItems = recs.map(function(r){ return Object.assign({_atId:r.id},r.fields); });
  } catch(e) { console.warn('PicklistItems sync:',e.message); }
}

async function syncBarcodes() {
  if (!isConfigured()) return;
  try {
    var recs = await atFetchAll('barcodes');
    state.barcodes = recs.map(function(r){ return Object.assign({_atId:r.id},r.fields); });
  } catch(e) { console.warn('Barcodes sync:',e.message); }
}

// ── PICKLIST HELPERS ──────────────────
function plStatusBadge(s) {
  var map = {Draft:'badge-gray',Active:'badge-blue',Picking:'badge-orange',Complete:'badge-green',Cancelled:'badge-red'};
  return '<span class="badge '+(map[s]||'badge-gray')+'">'+s+'</span>';
}

// Picklist ID is manual — entered by PM/Ops

function canBuildPicklist() {
  return ['ops_manager','project_manager','wh_manager','wh_worker'].indexOf(state.role) >= 0;
}

// ── RENDER PICKLISTS PAGE ─────────────
function renderPicklists() {
  var lists = state.picklists.filter(function(p){
    if (state.plFilter !== 'ALL' && p.status !== state.plFilter) return false;
    if (state.plSearch) {
      var q = state.plSearch.toLowerCase();
      return (p.picklist_id||'').toLowerCase().includes(q) || (p.job_name||'').toLowerCase().includes(q);
    }
    return true;
  });

  if (state.buildingPicklist) return renderPicklistBuilder();

  var filterBtns = ['ALL','Draft','Active','Picking','Complete','Cancelled'].map(function(s){
    return '<div class="filter-chip'+(state.plFilter===s?' active':'')+'" onclick="state.plFilter=\''+s+'\';render()">'+s+'</div>';
  }).join('');

  var rows = lists.length === 0
    ? '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text2)">No picklists found</td></tr>'
    : lists.map(function(p){
        var items = state.picklistItems.filter(function(i){return i.picklist_id===p.picklist_id;});
        var picked = items.filter(function(i){return i.status==='Picked';}).length;
        return '<tr onclick="openPicklist(\''+p.picklist_id+'\')">' +
          '<td class="mono" style="color:var(--accent)">'+p.picklist_id+'</td>' +
          '<td>'+p.job_name+'</td>' +
          '<td class="c-gray">'+p.warehouse+'</td>' +
          '<td>'+plStatusBadge(p.status||'Draft')+'</td>' +
          '<td class="mono">'+picked+'/'+items.length+'</td>' +
          '<td class="c-gray text-sm">'+p.created_by+'</td>' +
        '</tr>';
      }).join('');

  return '<div class="section-header">' +
    '<div class="section-title">Picklists</div>' +
    '<div class="section-count">'+lists.length+'</div>' +
    '<div class="section-actions">' +
      '<div class="btn btn-ghost" onclick="syncPicklists().then(render)">' + I.refresh + ' Refresh</div>' +
      (canBuildPicklist() ? '<div class="btn btn-primary" onclick="startNewPicklist()">'+I.plus+' New Picklist</div>' : '') +
    '</div></div>' +
  '<div class="filters">'+filterBtns+
    '<input type="text" class="filter-select" placeholder="Search job or ID\u2026" style="width:200px;border-radius:20px;padding:5px 12px" onblur="state.plSearch=this.value" onkeydown="handleEnterKey(event,function(){state.plSearch=this.value;render()})" value="'+(state.plSearch||'')+'">'+
  '</div>' +
  '<div class="table-wrap"><div class="table-scroll"><table>' +
    '<thead><tr><th>Picklist ID</th><th>Job Name</th><th>Warehouse</th><th>Status</th><th>Progress</th><th>Created By</th></tr></thead>' +
    '<tbody>'+rows+'</tbody>' +
  '</table></div></div>';
}

// ── PICKLIST BUILDER ──────────────────
function renderPicklistBuilder() {
  var pl = state.buildingPicklist;
  var items = pl.items || [];
  var inv = getInventory();
  var q = (pl.itemSearch||'').toLowerCase();
  var results = q.length > 1 ? inv.filter(function(i){
    return i.description.toLowerCase().includes(q) || i.barcode.toLowerCase().includes(q);
  }).slice(0,8) : [];

  var itemRows = items.length === 0
    ? '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text2)">No items added yet</td></tr>'
    : items.map(function(it,idx){
        return '<tr>' +
          '<td class="barcode-cell">'+it.barcode+'</td>' +
          '<td>'+it.description+'</td>' +
          '<td style="text-align:center"><div class="qty-cell" style="justify-content:center">' +
            '<div class="qty-btn" onclick="plAdjQty('+idx+',-1)">\u2212</div>' +
            '<span class="qty-display c-gold">'+it.qty_requested+'</span>' +
            '<div class="qty-btn" onclick="plAdjQty('+idx+',1)">+</div>' +
          '</div></td>' +
          '<td><div class="qty-btn" style="background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:var(--red)" onclick="plRemoveItem('+idx+')">&#10005;</div></td>' +
        '</tr>';
      }).join('');

  var searchResults = results.map(function(i){
    return '<div onclick="plAddItem(\''+i.barcode+'\')" style="padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px" onmouseover="this.style.background=\'var(--surface2)\'" onmouseout="this.style.background=\'\'">' +
      '<div><div style="font-weight:600">'+i.description+'</div><div class="mono c-gray" style="font-size:11px">'+i.barcode+'</div></div>' +
      '<span class="badge '+(i.qty>0?'badge-green':'badge-red')+'">'+i.qty+' on hand</span>' +
    '</div>';
  }).join('');

  return '<div style="max-width:760px">' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">' +
      '<div class="btn btn-ghost" onclick="state.buildingPicklist=null;render()">\u2190 Back</div>' +
      '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;letter-spacing:2px">'+(pl.picklist_id||'NEW PICKLIST')+'</div>' +
    '</div>' +

    '<div style="background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:20px;margin-bottom:16px">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">' +
        '<div class="field-group"><div class="field-label">Job Name</div>' +
          '<input class="field-input" id="plJobName" placeholder="e.g. Smith Residence" value="'+(pl.job_name||'')+'" onblur="state.buildingPicklist.job_name=this.value"></div>' +
        '<div class="field-group"><div class="field-label">Picklist ID / PO Number</div>' +
          '<input class="field-input mono" id="plId" value="'+(pl.picklist_id||'')+'" style="color:var(--accent)" placeholder="e.g. Smith-2240001" onblur="state.buildingPicklist.picklist_id=this.value"></div>' +
        '<div class="field-group"><div class="field-label">Warehouse</div>' +
          '<select class="field-input" id="plWh" onchange="state.buildingPicklist.warehouse=this.value">' +
            ['Chattanooga','Nashville','Knoxville'].map(function(w){ return '<option'+(pl.warehouse===w?' selected':'')+'>'+w+'</option>'; }).join('') +
          '</select></div>' +
        '<div class="field-group"><div class="field-label">PO Number</div>' +
          '<input class="field-input" id="plPoNumber" placeholder="e.g. PO-2240001" value="'+(pl.po_number||'')+'" onblur="state.buildingPicklist.po_number=this.value"></div>' +
        '<div class="field-group"><div class="field-label">Assign To</div>' +
          '<input class="field-input" id="plAssignedTo" placeholder="Warehouse worker name" value="'+(pl.assigned_to||'')+'" onblur="state.buildingPicklist.assigned_to=this.value"></div>' +
        '<div class="field-group"><div class="field-label">Notes</div>' +
          '<input class="field-input" id="plNotes" value="'+(pl.notes||'')+'" onblur="state.buildingPicklist.notes=this.value"></div>' +
      '</div>' +
    '</div>' +

    '<div style="background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:20px;margin-bottom:16px">' +
      '<div class="field-label" style="margin-bottom:8px">Add Items</div>' +
      '<input class="field-input" id="plItemSearch" placeholder="Search SKU or barcode\u2026" style="margin-bottom:8px" value="'+(pl.itemSearch||'')+'" oninput="state.buildingPicklist.itemSearch=this.value;clearTimeout(window._plst);window._plst=setTimeout(render,300)">' +
      (results.length > 0 ? '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px">'+searchResults+'</div>' : '') +
    '</div>' +

    '<div style="background:var(--surface);border:1px solid var(--border2);border-radius:12px;overflow:hidden;margin-bottom:16px">' +
      '<div style="padding:14px 16px;border-bottom:1px solid var(--border);font-family:\'Bebas Neue\',sans-serif;font-size:15px;letter-spacing:1px">ITEMS ('+items.length+')</div>' +
      '<div class="table-scroll"><table><thead><tr><th>Barcode</th><th>Description</th><th style="text-align:center">Qty</th><th></th></tr></thead>' +
      '<tbody>'+itemRows+'</tbody></table></div>' +
    '</div>' +

    '<div style="display:flex;gap:10px">' +
      '<div class="btn btn-primary" onclick="savePicklist(\'Draft\')">Save Draft</div>' +
      '<div class="btn btn-primary" style="background:var(--green)" onclick="savePicklist(\'Active\')">'+I.check+' Activate</div>' +
      '<div class="btn btn-ghost" onclick="state.buildingPicklist=null;render()">Cancel</div>' +
    '</div>' +
  '</div>';
}

// ── PICKLIST DETAIL (picking view) ────
function renderPicklistDetail(plId) {
  var pl = state.picklists.find(function(p){return p.picklist_id===plId;});
  if (!pl) return '<div class="empty-state">Picklist not found</div>';
  var items = state.picklistItems.filter(function(i){return i.picklist_id===plId;});
  var allPicked = items.length > 0 && items.every(function(i){return i.status==='Picked';});

  var rows = items.map(function(item){
    var picked = item.status === 'Picked';
    return '<tr style="opacity:'+(picked?'0.5':'1')+'">' +
      '<td class="barcode-cell">'+item.barcode+'</td>' +
      '<td>'+item.description+'</td>' +
      '<td class="mono" style="text-align:center">'+item.qty_requested+'</td>' +
      '<td class="mono c-green" style="text-align:center">'+(item.qty_picked||0)+'</td>' +
      '<td style="text-align:center">' +
        (picked
          ? '<span class="badge badge-green">'+I.check+' Picked</span>'
          : '<div class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="pickItem(\''+plId+'\',\''+item._atId+'\','+item.qty_requested+')">Confirm Pick</div>') +
      '</td>' +
    '</tr>';
  }).join('');

  return '<div style="max-width:760px">' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">' +
      '<div class="btn btn-ghost" onclick="state.page=\'picklists\';render()">\u2190 Back</div>' +
      '<div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:20px;letter-spacing:2px;color:var(--accent)">'+pl.picklist_id+'</div>' +
      '<div style="font-size:13px;color:var(--text2)">'+pl.job_name+' \u00b7 '+pl.warehouse+'</div></div>' +
      '<div style="margin-left:auto">'+plStatusBadge(pl.status)+'</div>' +
    '</div>' +
    '<div class="table-wrap"><div class="table-scroll"><table>' +
      '<thead><tr><th>Barcode</th><th>Description</th><th style="text-align:center">Requested</th><th style="text-align:center">Picked</th><th style="text-align:center">Action</th></tr></thead>' +
      '<tbody>'+rows+'</tbody>' +
    '</table></div></div>' +
    (allPicked ? '<div class="btn btn-primary" style="margin-top:16px;background:var(--green)" onclick="completePicklist(\''+plId+'\')">'+I.check+' Complete Picklist</div>' : '') +
    '<div class="btn btn-danger" style="margin-top:12px" onclick="cancelPicklist(\''+plId+'\')">&#10005; Cancel Picklist</div>' +
  '</div>';
}

// ── BARCODE GENERATOR PAGE ────────────
function renderBarcodes() {
  var suggestions = [];
  if (state.bcPrefix.length >= 2) {
    var existing = state.barcodes.filter(function(b){ return b.prefix === state.bcPrefix; });
    var nums = existing.map(function(b){ return parseInt((b.barcode||'').split('-').pop())||0; });
    var next = nums.length ? Math.max.apply(null,nums)+1 : 1;
    suggestions = [1,2,3].map(function(offset){
      return state.bcPrefix + '-' + String(next+offset-1).padStart(3,'0');
    });
  }

  var filtered = state.barcodes.filter(function(b){
    if (!state.bcSearch) return true;
    var q = state.bcSearch.toLowerCase();
    return (b.barcode||'').toLowerCase().includes(q) || (b.description||'').toLowerCase().includes(q);
  });

  var rows = filtered.length === 0
    ? '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text2)">No barcodes yet</td></tr>'
    : filtered.map(function(b){
        return '<tr>' +
          '<td class="mono" style="color:var(--accent)">'+b.barcode+'</td>' +
          '<td>'+b.description+'</td>' +
          '<td class="c-gray text-sm">'+b.category+'</td>' +
          '<td class="c-gray text-sm">'+b.created_by+'</td>' +
          '<td><div class="btn btn-ghost" style="font-size:11px;padding:3px 8px" onclick="copyBarcode(\''+b.barcode+'\')">'+I.copy+' Copy</div></td>' +
        '</tr>';
      }).join('');

  return '<div style="display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start">' +
    '<div>' +
      '<div style="background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:20px;margin-bottom:16px">' +
        '<div style="font-family:\'Bebas Neue\',sans-serif;font-size:16px;letter-spacing:2px;margin-bottom:16px;color:var(--accent)">GENERATE BARCODE</div>' +
        '<div class="field-group"><div class="field-label">Prefix (e.g. CS-SHLF)</div>' +
          '<input class="field-input" id="bcPrefixInput" placeholder="CS-SHLF" value="'+state.bcPrefix+'" onblur="state.bcPrefix=this.value.toUpperCase()" onkeydown="handleEnterKey(event,function(){state.bcPrefix=this.value.toUpperCase();render()})"></div>' +
        (suggestions.length ? '<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">' +
          suggestions.map(function(s){ return '<div class="filter-chip" onclick="document.getElementById(\'bcManual\').value=\''+s+'\';state.bcBarcode=\''+s+'\';" style="font-family:\'DM Mono\',monospace;font-size:11px">'+s+'</div>'; }).join('') +
        '</div>' : '') +
        '<div class="field-group"><div class="field-label">Barcode (manual or pick suggestion)</div>' +
          '<input class="field-input mono" id="bcManual" placeholder="CS-SHLF-001" oninput="state.bcBarcode=this.value" value="'+(state.bcBarcode||'')+'"></div>' +
        '<div class="field-group"><div class="field-label">Description</div>' +
          '<input class="field-input" id="bcDescInput" placeholder="Item description" value="'+state.bcDesc+'" onblur="state.bcDesc=this.value" onkeydown="handleEnterKey(event,function(){state.bcDesc=this.value})"></div>' +
        '<div class="field-group"><div class="field-label">Category</div>' +
          '<select class="field-input" onchange="state.bcCat=this.value">' +
            ['','VALVES/KITS/HANDHELDS','SEATS/BARS/SHELVES/ROD','SUPPLIES/ACCESSORIES','Bath/Shower','UNCATEGORIZED'].map(function(c){ return '<option'+(state.bcCat===c?' selected':'')+'>'+c+'</option>'; }).join('') +
          '</select></div>' +
        '<div class="field-group"><div class="field-label">Notes</div>' +
          '<input class="field-input" id="bcNotesInput" placeholder="Optional notes" value="'+state.bcNotes+'" onblur="state.bcNotes=this.value"></div>' +
        '<div class="btn btn-primary" style="width:100%;justify-content:center" onclick="saveBarcode()">'+I.barcode+' Save Barcode</div>' +
      '</div>' +
    '</div>' +
    '<div>' +
      '<div class="section-header"><div class="section-title">Barcode History</div><div class="section-count">'+state.barcodes.length+'</div>' +
        '<div class="section-actions"><div class="btn btn-ghost" onclick="syncBarcodes().then(render)">'+I.refresh+'</div></div>' +
      '</div>' +
      '<input type="text" class="field-input" placeholder="Search barcodes\u2026" style="margin-bottom:12px" oninput="state.bcSearch=this.value;render()" value="'+state.bcSearch+'">' +
      '<div class="table-wrap"><div class="table-scroll"><table>' +
        '<thead><tr><th>Barcode</th><th>Description</th><th>Category</th><th>Created By</th><th></th></tr></thead>' +
        '<tbody>'+rows+'</tbody>' +
      '</table></div></div>' +
    '</div>' +
  '</div>';
}

// ── ACTIONS ───────────────────────────
function startNewPicklist() {
  state.buildingPicklist = { job_name:'', picklist_id:'', warehouse:state.warehouse!=='ALL'?state.warehouse:'Chattanooga', notes:'', items:[], itemSearch:'' };
  render();
}

// updatePlId removed — ID is manual entry

function plAddItem(barcode) {
  var item = state.inventory.find(function(i){return i.barcode===barcode;});
  if (!item) return;
  var pl = state.buildingPicklist;
  var existing = pl.items.find(function(i){return i.barcode===barcode;});
  if (existing) { existing.qty_requested++; }
  else { pl.items.push({barcode:item.barcode, description:item.description, qty_requested:1, qty_picked:0, status:'Pending'}); }
  pl.itemSearch = '';
  render();
}

function plAdjQty(idx, delta) {
  var items = state.buildingPicklist.items;
  items[idx].qty_requested = Math.max(1, items[idx].qty_requested + delta);
  render();
}

function plRemoveItem(idx) {
  state.buildingPicklist.items.splice(idx, 1);
  render();
}

async function savePicklist(status) {
  var pl = state.buildingPicklist;
  // Read directly from DOM in case user hasn't blurred the fields yet
  var jobEl = document.getElementById('plJobName');
  var idEl  = document.getElementById('plId');
  var notEl = document.getElementById('plNotes');
  var poEl  = document.getElementById('plPoNumber');
  var atEl  = document.getElementById('plAssignedTo');
  if (jobEl && jobEl.value.trim()) pl.job_name    = jobEl.value.trim();
  if (idEl  && idEl.value.trim())  pl.picklist_id = idEl.value.trim();
  if (notEl && notEl.value)        pl.notes       = notEl.value;
  if (poEl  && poEl.value)         pl.po_number   = poEl.value.trim();
  if (atEl  && atEl.value)         pl.assigned_to = atEl.value.trim();
  if (!pl.job_name || !pl.picklist_id) { showToast('Job name and Picklist ID are required', 'error'); return; }
  if (pl.items.length === 0) { showToast('Add at least one item', 'error'); return; }
  var now = new Date().toISOString().replace('T',' ').slice(0,19);
  try {
    // Create picklist header
    // Debug: log what we're sending
    var plFields = {
      picklist_id:  pl.picklist_id,
      job_name:     pl.job_name,
      po_number:    pl.po_number||'',
      warehouse:    pl.warehouse,
      status:       status,
      created_by:   CONFIG.username||state.role,
      create_at:    new Date().toISOString().slice(0,10),
      assigned_to:  pl.assigned_to||'',
      notes:        pl.notes||''
    };
    console.log('Sending to Picklists:', JSON.stringify(plFields));
    var rec = await atCreate('picklists', plFields);
    // Create each line item
    for (var i=0; i<pl.items.length; i++) {
      var it = pl.items[i];
      await atCreate('picklistItems', {
        barcode:      it.barcode,
        description:  it.description
      });
    }
    showToast('Picklist '+pl.picklist_id+' saved', 'success');
    state.buildingPicklist = null;
    await syncPicklists();
    await syncPicklistItems();
    render();
  } catch(e) { showToast('Save failed: '+e.message, 'error'); }
}

async function pickItem(plId, itemAtId, qtyRequested) {
  var now = new Date().toISOString().replace('T',' ').slice(0,19);
  try {
    await atUpdate('picklistItems', itemAtId, {
      notes: 'Picked by ' + (CONFIG.username||state.role) + ' at ' + now
    });
    showToast('Item confirmed picked', 'success');
    await syncPicklistItems(plId);
    render();
  } catch(e) { showToast('Update failed: '+e.message, 'error'); }
}

async function completePicklist(plId) {
  var pl = state.picklists.find(function(p){return p.picklist_id===plId;});
  if (!pl) return;
  try {
    await atUpdate('picklists', pl._atId, { status:'Complete' });
    showToast('Picklist '+plId+' completed', 'success');
    await syncPicklists();
    state.page = 'picklists';
    render();
  } catch(e) { showToast('Update failed: '+e.message, 'error'); }
}

async function cancelPicklist(plId) {
  if (!confirm('Cancel picklist '+plId+'? This cannot be undone.')) return;
  var pl = state.picklists.find(function(p){return p.picklist_id===plId;});
  if (!pl) return;
  try {
    await atUpdate('picklists', pl._atId, { status:'Cancelled' });
    showToast('Picklist '+plId+' cancelled', 'info');
    await syncPicklists();
    state.page = 'picklists';
    render();
  } catch(e) { showToast('Update failed: '+e.message, 'error'); }
}

function openPicklist(plId) {
  syncPicklistItems(plId).then(function(){
    document.getElementById('mainContent').innerHTML = renderPicklistDetail(plId);
  });
}

async function saveBarcode() {
  var bc = (state.bcBarcode||'').trim().toUpperCase();
  var desc = (state.bcDesc||'').trim();
  if (!bc || !desc) { showToast('Barcode and description required', 'error'); return; }
  if (state.barcodes.find(function(b){return b.barcode===bc;})) { showToast('Barcode already exists', 'error'); return; }
  var now = new Date().toISOString().replace('T',' ').slice(0,19);
  try {
    await atCreate('barcodes', {
      barcode:bc, description:desc, category:state.bcCat||'UNCATEGORIZED',
      prefix:state.bcPrefix||'', created_by:CONFIG.username||state.role,
      created_at:now, notes:state.bcNotes||''
    });
    showToast('Barcode '+bc+' saved', 'success');
    state.bcBarcode=''; state.bcDesc=''; state.bcNotes='';
    await syncBarcodes();
    render();
  } catch(e) { showToast('Save failed: '+e.message, 'error'); }
}

function copyBarcode(bc) {
  navigator.clipboard.writeText(bc).then(function(){ showToast('Copied: '+bc, 'success'); });
}

// ── MOBILE PWA META (inject into head) ─
// Add to manifest via JS since we can't edit head after load
(function(){
  // PWA meta now in <head> statically
  var m3 = document.createElement('meta');
  m3.name='apple-mobile-web-app-status-bar-style'; m3.content='black-translucent';
  document.head.appendChild(m3);
  // Mobile CSS overrides
  var style = document.createElement('style');
  style.textContent = '@media(max-width:768px){.sidebar{position:fixed;z-index:60;height:100vh;transform:translateX(-100%);transition:transform 0.25s}.sidebar.mobile-open{transform:translateX(0)}.sidebar:not(.mobile-open){width:0;min-width:0}.topbar{padding:0 12px;gap:10px}.topbar-search{display:none}.content{padding:16px}.stats-row{grid-template-columns:1fr 1fr}.detail-panel{width:100vw}.modal{width:95vw}.scan-actions{grid-template-columns:1fr 1fr}.topbar-title{font-size:16px}table{font-size:12px}td,th{padding:8px 10px}.section-header{flex-wrap:wrap}.section-actions{margin-left:0;width:100%}}';
  document.head.appendChild(style);
})();

// ── OVERRIDE BINDINGS FOR MOBILE SIDEBAR ─
var _origBindMain = bindMain;
bindMain = function() {
  _origBindMain();
  var tog = document.getElementById('toggleSidebar');
  var sb  = document.getElementById('sidebar');
  if (tog && sb && window.innerWidth <= 768) {
    tog.onclick = function() {
      sb.classList.toggle('mobile-open');
    };
    // close sidebar on nav tap (mobile)
    document.querySelectorAll('[data-page]').forEach(function(el){
      el.addEventListener('click', function(){ if(sb) sb.classList.remove('mobile-open'); });
    });
  }
};

// ── PATCH syncInventory TO ALSO SYNC PICKLISTS/BARCODES ─
var _origSync = syncInventory;
syncInventory = async function() {
  await _origSync();
  await syncPicklists();
  await syncPicklistItems();
  await syncBarcodes();
};

</script>
